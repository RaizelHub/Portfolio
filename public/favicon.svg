<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background near-black surface -->
  <rect width="512" height="512" rx="48" fill="#171717" />
  
  <!-- Outer technical border line -->
  <rect x="24" y="24" width="464" height="464" rx="32" fill="none" stroke="#D5D0C7" stroke-width="12" />

  <!-- Accent square dot top right -->
  <rect x="400" y="72" width="40" height="40" rx="4" fill="#C7462D" />

  <!-- Monogram text "JS" -->
  <text
    x="50%"
    y="54%"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="800"
    font-size="240"
    fill="#F4F1EA"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-6"
  >JS</text>
</svg>